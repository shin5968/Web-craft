name: Compile original Minecraft class
on:
  push:
    branches: [main]
    paths:
      - 'minecraft-smoke/**'
      - 'tools/prepare_minecraft_smoke.py'
      - 'tools/check_minecraft_smoke.mjs'
      - 'web/minecraft-smoke-check.mjs'
      - 'web/bit-storage-check.mjs'
      - 'tools/check_bit_storage.mjs'
      - 'web/voxel-*.mjs'
      - 'web/index.html'
      - 'tools/test_voxel.mjs'
      - 'tools/test_voxel_edit.mjs'
      - 'tools/check_voxel_storage.mjs'
      - 'tools/browser_voxel_smoke.cjs'
      - '.github/workflows/minecraft-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: minecraft-smoke/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage hash-pinned original class
        run: python3 tools/prepare_minecraft_smoke.py
      - name: Inspect original method signatures
        run: javap -classpath minecraft-smoke/input/client.jar net.minecraft.util.FastBufferedInputStream net.minecraft.util.SimpleBitStorage
      - name: Compile original bytecode to Wasm GC
        run: mvn -B -f minecraft-smoke/pom.xml package
      - name: Verify original buffered stream operations
        run: node tools/check_minecraft_smoke.mjs
      - name: Verify original packed block storage
        run: node tools/check_bit_storage.mjs
      - name: Verify visible-face meshing and original storage integration
        run: |
          node tools/test_voxel.mjs
          node tools/test_voxel_edit.mjs
          node tools/check_voxel_storage.mjs
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/webcraft-browser" --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/webcraft-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render terrain in headless WebGPU browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/webcraft-browser/node_modules/playwright
        run: node tools/browser_voxel_smoke.cjs
      - name: Upload provenance and results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-class-report
          path: web/minecraft-smoke/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload renderer test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxel-render-check
          path: reports/voxel-render.png
          if-no-files-found: ignore
          retention-days: 7
